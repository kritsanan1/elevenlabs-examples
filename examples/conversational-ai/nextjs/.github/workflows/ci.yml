name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  CACHE_KEY: 'node-modules'

jobs:
  # =============================================
  # SETUP AND VALIDATION
  # =============================================
  validate:
    name: 🔍 Environment Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 🔍 Validate Package Lock
        working-directory: examples/conversational-ai/nextjs
        run: npm audit --audit-level=high
        
      - name: 📋 Check Environment Template
        working-directory: examples/conversational-ai/nextjs
        run: |
          if [ ! -f .env.example ]; then
            echo "❌ .env.example file is missing"
            exit 1
          fi
          echo "✅ Environment template exists"

  # =============================================
  # CODE QUALITY CHECKS
  # =============================================
  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 🧹 Run ESLint
        working-directory: examples/conversational-ai/nextjs
        run: npm run lint
        
      - name: 🔍 TypeScript Check
        working-directory: examples/conversational-ai/nextjs
        run: npx tsc --noEmit
        
      - name: 🎨 Check Prettier Format
        working-directory: examples/conversational-ai/nextjs
        run: |
          if command -v prettier >/dev/null 2>&1; then
            npx prettier --check "**/*.{ts,tsx,js,jsx,json,md}"
          else
            echo "⚠️ Prettier not configured, skipping format check"
          fi

  # =============================================
  # SECURITY SCANNING
  # =============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 🔒 Security Audit
        working-directory: examples/conversational-ai/nextjs
        run: npm audit --audit-level=moderate
        
      - name: 🕵️ Check for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./examples/conversational-ai/nextjs
          base: main
          head: HEAD

  # =============================================
  # BUILD TESTING
  # =============================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [validate, lint]
    strategy:
      matrix:
        node-version: [18, 20]
        
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 🏗️ Build Application
        working-directory: examples/conversational-ai/nextjs
        run: npm run build
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'test-key-for-build' }}
          AGENT_ID: ${{ secrets.AGENT_ID || 'test-agent-for-build' }}
          
      - name: 📊 Analyze Bundle Size
        working-directory: examples/conversational-ai/nextjs
        run: |
          if [ -d ".next" ]; then
            echo "📦 Build artifacts created successfully"
            du -sh .next/static/chunks/* | head -10
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
          
      - name: 💾 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-node-${{ matrix.node-version }}
          path: examples/conversational-ai/nextjs/.next/
          retention-days: 1

  # =============================================
  # UNIT TESTING
  # =============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 🧪 Run Unit Tests
        working-directory: examples/conversational-ai/nextjs
        run: |
          if npm list jest >/dev/null 2>&1; then
            npm test -- --coverage --watchAll=false
          elif npm list vitest >/dev/null 2>&1; then
            npm run test:ci
          else
            echo "⚠️ No test framework found, skipping tests"
            echo "Consider adding Jest or Vitest for testing"
          fi
          
      - name: 📊 Upload Coverage Reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: examples/conversational-ai/nextjs/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # =============================================
  # INTEGRATION TESTING
  # =============================================
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 💾 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node-18
          path: examples/conversational-ai/nextjs/.next/
          
      - name: 🚀 Start Application
        working-directory: examples/conversational-ai/nextjs
        run: |
          npm start &
          echo $! > app.pid
          sleep 10
        env:
          PORT: 3000
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || 'test-key' }}
          AGENT_ID: ${{ secrets.AGENT_ID || 'test-agent' }}
          
      - name: 🔍 Health Check
        run: |
          max_attempts=10
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts"
            
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "✅ Application is responding"
              break
            fi
            
            if [ $attempt -eq $max_attempts ]; then
              echo "❌ Application failed to start"
              exit 1
            fi
            
            sleep 5
            attempt=$((attempt + 1))
          done
          
      - name: 🧪 Run API Tests
        working-directory: examples/conversational-ai/nextjs
        run: |
          # Test API endpoints
          echo "Testing API endpoints..."
          
          # Test signed-url endpoint (should return 400 without valid credentials)
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/signed-url)
          if [ "$status" = "400" ]; then
            echo "✅ API endpoint responding correctly"
          else
            echo "❌ API endpoint returned unexpected status: $status"
          fi
          
      - name: 🛑 Stop Application
        if: always()
        working-directory: examples/conversational-ai/nextjs
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
            rm app.pid
          fi

  # =============================================
  # DEPLOYMENT PREPARATION
  # =============================================
  deploy-check:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    needs: [lint, security, build, test, integration]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        
      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'examples/conversational-ai/nextjs/package-lock.json'
          
      - name: 📦 Install Dependencies
        working-directory: examples/conversational-ai/nextjs
        run: npm ci
        
      - name: 💾 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-node-18
          path: examples/conversational-ai/nextjs/.next/
          
      - name: 🔍 Production Build Validation
        working-directory: examples/conversational-ai/nextjs
        run: |
          echo "🔍 Validating production build..."
          
          # Check if critical files exist
          critical_files=(
            ".next/BUILD_ID"
            ".next/static"
            ".next/server"
          )
          
          for file in "${critical_files[@]}"; do
            if [ -e "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ Missing critical file: $file"
              exit 1
            fi
          done
          
          echo "✅ Production build validation complete"
          
      - name: 📊 Bundle Analysis
        working-directory: examples/conversational-ai/nextjs
        run: |
          echo "📊 Analyzing bundle size..."
          
          # Calculate total bundle size
          total_size=$(du -sh .next/static | cut -f1)
          echo "Total static assets size: $total_size"
          
          # Check for oversized chunks
          find .next/static/chunks -name "*.js" -size +1M -exec echo "⚠️ Large chunk found: {} $(du -h {} | cut -f1)" \;
          
      - name: 🎯 Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Security Scan**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Build**: Successful" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Integration**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Ready for deployment!**" >> $GITHUB_STEP_SUMMARY

  # =============================================
  # NOTIFICATION
  # =============================================
  notify:
    name: 📢 Notification
    runs-on: ubuntu-latest
    needs: [lint, security, build, test, integration]
    if: always()
    
    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🔄 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check job results
          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ **Code Quality**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Code Quality**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security.result }}" = "success" ]; then
            echo "✅ **Security Scan**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Security Scan**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ **Build**: Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.integration.result }}" = "success" ]; then
            echo "✅ **Integration**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Integration**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "👤 **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
